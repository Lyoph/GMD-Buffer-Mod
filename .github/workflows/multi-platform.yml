name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    # mod.json only lists iOS (gd.ios), so iOS is the only target.
    name: iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: iOS
          # The bindings repo's main branch is mid-update for a newer GD
          # version and does not build against stable SDK 5.11.2. Pin it to
          # the last commit before the 5.11.2 release, and build the matching
          # Codegen from source. Remove both lines once Geode publishes the
          # next stable release.
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      # When a version tag (v1.0.2, ...) is pushed, attach the CI-built .geode
      # to that tag's release, creating the release if needed. It never
      # overwrites a file that is already on the release.
      - name: Attach build to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.build.outputs.build-output }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$OUT_DIR"/*.geode --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$OUT_DIR"/*.geode --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
